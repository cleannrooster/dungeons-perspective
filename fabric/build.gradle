plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur' version '2.+'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    // loom-no-remap doesn't expose fabric-api's jar-in-jar modules on the compile classpath,
    // so depend on the individual modules we use directly.
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.0+00cb03469e"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"

    // 26.2 is unobfuscated, so the Architectury remap-transform variants (namedElements /
    // transformProductionFabric) aren't produced under loom-no-remap. Depend on :common directly
    // and bundle its classes into the shadow jar.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common')

    // YACL - fabric
    implementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-${platform}"

    // Cloth Config
    implementation "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // ModMenu
    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // Sodium (for compat)
    implementation "maven.modrinth:sodium:${rootProject.sodium_version}-${platform}"

    // MixinSquared
    annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-common:${rootProject.mixinsquared_version}"
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${rootProject.mixinsquared_version}"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // 26.2 is unobfuscated: bundle :common's compiled classes and resources directly (no remap).
    from project(':common').sourceSets.main.output
    archiveClassifier = 'dev-shadow'
}

jar {
    // No remapJar in no-remap mode: unpack the shadow jar's contents into the final jar.
    dependsOn shadowJar
    from zipTree(shadowJar.archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
