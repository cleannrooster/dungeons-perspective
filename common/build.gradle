architectury {
    common rootProject.enabled_platforms.split(',')
}

def platform = "fabric"

dependencies {
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    compileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // YACL - compile against fabric variant in common
    compileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-${platform}"

    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // ModMenu (optional - compile only)
    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // Sodium (optional compat - compile only)
    compileOnly "maven.modrinth:sodium:${rootProject.sodium_version}-${platform}"

    // MixinSquared
    compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-common:${rootProject.mixinsquared_version}"
    annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-common:${rootProject.mixinsquared_version}"
}
