plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur' version '2.+'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // 26.2 is unobfuscated, so the Architectury remap-transform variants (namedElements /
    // transformProductionNeoForge) aren't produced under loom-no-remap. Depend on :common directly
    // and bundle its classes into the shadow jar.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common')

    // YACL - neoforge
    implementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"

    // Cloth Config - neoforge
    implementation "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // Sodium - neoforge (optional compat)
    compileOnly "maven.modrinth:sodium:${rootProject.sodium_version}-neoforge"

}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // 26.2 is unobfuscated: bundle :common's compiled classes and resources directly (no remap).
    from project(':common').sourceSets.main.output
    archiveClassifier = 'dev-shadow'
}

jar {
    // No remapJar in no-remap mode: unpack the shadow jar's contents into the final jar.
    dependsOn shadowJar
    from zipTree(shadowJar.archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
